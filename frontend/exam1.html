<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exam 1</title>
  <link rel="stylesheet" href="exam.css" />
</head>
<body>
  <header id="nav-bar">
    <h1 id="site-title">Mock Language Exam</h1>
  </header>

  <main>
    <section class="card" id="card"></section>
    <div class="submitted" id="submitted">Submitted &mdash; thank you.</div>
  </main>

  <div class="overlay" id="recordingOverlay">
    <div class="modal">
      <p>Recording is over.</p>
      <button class="btn" id="popupOkBtn">OK</button>
    </div>
  </div>

  <script>

    // question/answer element ids so gaze data stays distinguishable per
    // question even though only one page's markup exists in the DOM at once.
    const PAGES = [
      {
        type: "audio",
        id: "q1",
        instructions: "Play audio, then answer the question with the following answer choices.",
        audioSrc: "audio/exam1/clip_01.mp3",
        choices: ["With red paint.", "Very much.", "My mother does."]
      },
      {
        type: "audio",
        id: "q2",
        instructions: "Play audio, then answer the question with the following answer choices.",
        audioSrc: "audio/exam1/clip_02.mp3",
        choices: ["No, he doesn't.", "No, she doesn't.", "No, they don't."]
      },
      {
        type: "audio",
        id: "q3",
        instructions: "Play audio, then answer the question with the following answer choices.",
        audioSrc: "audio/exam1/clip_03.mp3",
        choices: ["They must return it then.", "They will get it then.", "They returned it then."]

      {
        type: "audio",
        id: "q4",
        instructions: "Play audio, then answer the question with the following answer choices.",
        audioSrc: "audio/exam1/clip_04.mp3",
        choices: ["No, not yet.", "No, she isn't.", "No, he hasn't."]

      {
        type: "audio",
        id: "q5",

        audioSrc: "audio/exam1/clip_05.mp3",

        id: "q7",

        audioSrc: "audio/exam1/clip_07.mp3",

      {
        type: "audio",
        id: "q8",

        type: "audio",
        id: "q9",

        type: "audio",
        id: "q10",
        instructions: "Play audio, then answer the question with the following answer choices.",
        audioSrc: "audio/exam1/clip_10.mp3",
        choices: ["Yes, it was clean.", "Yes, she has it.", "No, her daughter helped."]
      },
      {
        type: "audio",
        id: "q11",
        instructions: "Play audio, then answer the question with the following answer choices.",

      },

        type: "text",
        id: "q29",
        lines: ["“Where is my book?”", "“Oh, I forgot to ____.”"],
