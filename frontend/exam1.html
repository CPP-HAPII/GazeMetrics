<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exam 1</title>
  <link rel="stylesheet" href="exam.css" />
</head>
<body>
  <header id="nav-bar">
    <h1 id="site-title">Mock Language Exam</h1>
  </header>

  <main>
    <section class="card" id="card"></section>
    <div class="submitted" id="submitted">Submitted &mdash; thank you.</div>
  </main>

  <div class="overlay" id="recordingOverlay">
    <div class="modal">
      <p>Recording is over.</p>
      <button class="btn" id="popupOkBtn">OK</button>
    </div>
  </div>

  <script>
    // Each page is rendered one at a time into #card. `id` namespaces the
    // question/answer element ids so gaze data stays distinguishable per
    // question even though only one page's markup exists in the DOM at once.
    const PAGES = [
      {
        type: "directions",
        id: "listening-directions",
        title: "Listening Comprehension",
        audioSrc: "audio/formA/audioDirections.mp3",
        compact: true,
        buttonLabel: "Begin",
        body: `
          <p>This is a test of how well you understand spoken English. The examiner will either ask a question or make a statement. To show that you have understood what was said, you should choose the ONE answer choice that is correct.</p>
          <div class="examples">
            <div class="example">
              <p>Here is an example of the question type of problem. Listen carefully to the question, then choose the ONE answer choice that is a reasonable response or answer.</p>
              <p class="example-label">Example I.</p>
              <ul class="example-choices">
                <li>a. I am.</li>
                <li>b. Tomorrow.</li>
                <li>c. To Detroit.</li>
              </ul>
              <p>The correct response is choice b, “Tomorrow.” Choice b has been marked on your answer sheet to show that it is the correct answer to Example I.</p>
            </div>
            <div class="example">
              <p>Now here is an example of the statement type of problem. Listen to the statement and then choose the ONE phrase or sentence that corresponds to it.</p>
              <p class="example-label">Example II.</p>
              <ul class="example-choices">
                <li>a. Only John went.</li>
                <li>b. Only Mary went.</li>
                <li>c. They both went.</li>
              </ul>
              <p>“John and Mary went to the store,” means that they both went. On your answer sheet, for Example II, mark the space after choice c to show that “They both went,” is the correct answer.</p>
            </div>
          </div>
          <p>Do not make any marks in this test booklet. Mark all your answers on the separate answer sheet. If you do not know how to do this test, raise your hand and the instructor will explain it to you.</p>
          <p>Please be quiet and listen carefully. None of the questions or statements can be repeated.</p>
          <p>Now, turn the page to problem number one.</p>
        `
      },
      {
        type: "audio",
        id: "q1",
        instructions: "Play the audio, then choose the best answer. You can only play it once.",
        audioSrc: "audio/formA/q01.mp3",
        choices: ["With red paint.", "Very much.", "My mother does."]
      },
      {
        type: "audio",
        id: "q2",
        instructions: "Play the audio, then choose the best answer. You can only play it once.",
        audioSrc: "audio/formA/q02.mp3",
        choices: ["No, he doesn't.", "No, she doesn't.", "No, they don't."]
      },
      {
        type: "audio",
        id: "q3",
        instructions: "Play the audio, then choose the best answer. You can only play it once.",
        audioSrc: "audio/formA/q03.mp3",
        choices: ["They must return it then.", "They will get it then.", "They returned it then."]
      },
      {
        type: "audio",
        id: "q4",
        instructions: "Play the audio, then choose the best answer. You can only play it once.",
        audioSrc: "audio/formA/q04.mp3",
        choices: ["No, not yet.", "No, she isn't.", "No, he hasn't."]
      },
      {
        type: "audio",
        id: "q5",
        instructions: "Play the audio, then choose the best answer. You can only play it once.",
        audioSrc: "audio/formA/q05.mp3",
        choices: ["She has enough light.", "She has too much light.", "She needs more light."]
      },
      {
        type: "audio",
        id: "q6",
        instructions: "Play the audio, then choose the best answer. You can only play it once.",
        audioSrc: "audio/formA/q06.mp3",
        choices: ["Yes, he would.", "He'd go to Harvard.", "He went to the state college."]
      },
      {
        type: "audio",
        id: "q7",
        instructions: "Play the audio, then choose the best answer. You can only play it once.",
        audioSrc: "audio/formA/q07.mp3",
        choices: ["Jean is sick.", "Bill is sick.", "Bill is worried."]
      },
      {
        type: "audio",
        id: "q8",
        instructions: "Play the audio, then choose the best answer. You can only play it once.",
        audioSrc: "audio/formA/q08.mp3",
        choices: ["To see his friend.", "By plane.", "For a week."]
      },
      {
        type: "audio",
        id: "q9",
        instructions: "Play the audio, then choose the best answer. You can only play it once.",
        audioSrc: "audio/formA/q09.mp3",
        choices: ["She had a car.", "She will have a car.", "She didn't have a car."]
      },
      {
        type: "audio",
        id: "q10",

      {

        id: "directions",
        title: "Directions",
        body: "Read each question carefully and choose the answer that best completes it. Replace this placeholder text with the exam's actual directions.",

      },
      {
        type: "text",
        id: "q21",
        lines: ["“It’s very hot here.”", "“Yes, but ____ the winter it gets very cold.”"],
        choices: ["already", "as long as", "while", "during"]
      },
      {
        type: "text",
        id: "q22",
        lines: ["“How was the movie?”", "“Great. Everyone liked it ____ John who said it was terrible.”"],

      },
      {
        type: "text",
        id: "q23",
        lines: ["“When did Tom graduate?”", "“He ____ in 1968.”"],
        choices: ["graduate", "did graduate", "graduated", "was graduate"]
      },
      {
        type: "text",
        id: "q24",
        lines: ["“Are you making the trip in one day?”", "“It depends on ____ many miles it is to New York.”"],

      },
      {
        type: "text",
        id: "q25",
        lines: ["“Do you think John can pass the test?”", "“If he studies hard, I think he ____.”"],
        choices: ["will be", "will", "will have", "will be going to"]
      },
      {
        type: "text",
        id: "q26",
        lines: ["“Which book did you take?”", "“The one ____.”"],
        choices: ["that was on the table", "that on the table", "on the table was", "was on the table"]
      },
      {
        type: "text",
        id: "q27",
        lines: ["“What should I get at the store?”", "“____ of bread.”"],
        choices: ["A loaf", "The loaf", "Some loaf", "Loaf"]
      },
      {
        type: "text",
        id: "q28",
        lines: ["“Will you come to the party?”", "“I don’t know. I’ll think it ____.”"],
        choices: ["about", "over", "around", "along"]
      },
      {
        type: "text",
        id: "q29",
        lines: ["“Where is my book?”", "“Oh, I forgot to ____.”"],
        choices: ["in it bring", "in bring it", "bring it in", "bring in it"]
      },
      {
        type: "text",
        id: "q30",
        lines: ["“Isn’t Barbara having lunch today?”", "“No, she’s ____ she can’t take time to eat.”"],
        choices: ["so busy as", "as busy as", "such busy", "so busy that"]
      }
    ];
  </script>
  <script src="exam.js"></script>
  <script>
    startExam(PAGES);
