<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sample Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1f2933;
      background: #f5f7fa;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }
    header {
      background: #14304a;
      color: #fff;
      padding: 22px 40px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    header h1 { font-size: 26px; letter-spacing: .3px; }
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 40px;
      overflow: hidden;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 48px 56px;
      box-shadow: 0 1px 3px rgba(16,42,67,.12);
      width: 80%;
      height: 80%;
      display: flex;
      flex-direction: column;
    }
    .prompt-label {
      font-size: 15px;
      color: #2f6fb0;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .twister {
      font-size: 32px;
      line-height: 1.5;
      color: #14304a;
      font-style: italic;
      margin-bottom: 40px;
      padding: 26px 30px;
      background: #f0f4f9;
      border-left: 5px solid #2f6fb0;
      border-radius: 6px;
    }
    .options { display: flex; flex-direction: column; gap: 16px; }
    .option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      border: 1px solid #d7dee6;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .1s, background .1s;
    }
    .option:hover { border-color: #2f6fb0; background: #f7fafd; }
    .option input { accent-color: #2f6fb0; width: 20px; height: 20px; }
    .option label { font-size: 19px; cursor: pointer; flex: 1; }
    .actions { display: flex; justify-content: flex-end; margin-top: auto; padding-top: 24px; }
    .btn {
      background: #2f6fb0;
      color: #fff;
      border: none;
      padding: 14px 34px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background .1s;
    }
    .btn:hover { background: #3a80c8; }
    .submitted {
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      font-size: 24px;
      color: #14304a;
    }
    .submitted.show { display: flex; }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 20, 33, .55);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .overlay.show { display: flex; }
    .overlay .modal {
      background: #fff;
      color: #1f2933;
      max-width: 400px;
      width: min(90vw, 400px);
      border-radius: 14px;
      padding: 28px 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .overlay .modal p { font-size: 17px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <header id="nav-bar">
    <h1 id="site-title">Mock Language Exam</h1>
  </header>

  <main>
    <section class="card" id="page-2">
      <div class="prompt-label" id="instructions">Read the tongue twister, then answer below</div>
      <div id="question-2">
        <p class="twister">How much wood would a woodchuck chuck if a woodchuck could chuck wood?</p>
      </div>
      <div class="options">
        <div class="option" id="answer-a"><input type="radio" name="q2" id="q2-a" value="a"><label for="q2-a">A tongue twister about a woodchuck</label></div>
        <div class="option" id="answer-b"><input type="radio" name="q2" id="q2-b" value="b"><label for="q2-b">A tongue twister about a carpenter</label></div>
        <div class="option" id="answer-c"><input type="radio" name="q2" id="q2-c" value="c"><label for="q2-c">A tongue twister about a lumberjack</label></div>
        <div class="option" id="answer-d"><input type="radio" name="q2" id="q2-d" value="d"><label for="q2-d">A tongue twister about a beaver</label></div>
      </div>
      <div class="actions">
        <button class="btn" id="submitBtn">Submit</button>
      </div>
    </section>
    <div class="submitted" id="submitted">Submitted &mdash; thank you.</div>
  </main>

  <div class="overlay" id="recordingOverlay">
    <div class="modal">
      <p>Recording is over.</p>
      <button class="btn" id="popupOkBtn">OK</button>
    </div>
  </div>

  <script>
    document.getElementById("submitBtn").addEventListener("click", async () => {
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("page-2").style.display = "none";
      document.getElementById("submitted").classList.add("show");
      document.getElementById("recordingOverlay").classList.add("show");
      try {
        await window.parent.finishExam();
      } catch { /* ignore */ }
    });

    document.getElementById("popupOkBtn").addEventListener("click", () => {
      document.getElementById("recordingOverlay").classList.remove("show");
    });
  </script>
</body>
</html>
