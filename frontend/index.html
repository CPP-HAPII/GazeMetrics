<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eye-Tracking Analysis Demo</title>
  <script>
    // Without a participant ID, go straight to the landing page. This runs
    // before anything is drawn, so this page never flashes on screen first.
    (function () {
      var id = new URLSearchParams(window.location.search).get("id");
      if (!id) {
        try { id = sessionStorage.getItem("participantId"); } catch (e) { /* ignore */ }
      }
      if (!(id || "").trim()) window.location.replace("landing.html");
    })();
  </script>
  <!-- Start downloading the eye-tracking library now, so the capture page
       finds it already in the browser's cache. -->
  <link rel="prefetch" href="https://cdn.jsdelivr.net/npm/webgazer@3.4.0/dist/webgazer.min.js" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1E4D2B; color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .wrap { max-width: 560px; padding: 40px; text-align: center; }
    h1 { font-size: 34px; margin-bottom: 14px; }
    p { color: #D5E3CF; line-height: 1.6; margin-bottom: 28px; }
    .cards { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
    a.card {
      background: #FFB500; color: #1E4D2B; text-decoration: none;
      padding: 20px 26px; border-radius: 12px; min-width: 180px;
      transition: transform .1s, background .1s;
    }
    a.card:hover { transform: translateY(-2px); background: #FFC72C; }
    a.card b { display: block; font-size: 18px; margin-bottom: 6px; }
    a.card span { font-size: 13px; opacity: .85; }
    a.skip { display: inline-block; margin-top: 18px; font-size: 14px; color: #D5E3CF; }
    a.skip:hover { color: #fff; }
    .steps { margin-top: 34px; font-size: 13px; color: #A9C2A6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="cards">
      <a class="card" id="captureLink" href="capture.html">
        <b>Calibrate &amp; Capture</b>
        <span>Calibrate → record your gaze</span>
      </a>
    </div>
    <a class="skip" href="exam1.html">Skip calibration</a>
    <br />
    <a class="skip" id="readingLink" href="capture.html?start=reading-directions">Skip to reading tasks (testing)</a>
    <p class="steps">Requires a webcam. All camera processing happens locally in your browser.</p>
  </div>

  <script src="config.js"></script>
  <script>
    // The participant ID comes from the landing page; without one, go there first.
    (function () {
      let id = new URLSearchParams(window.location.search).get("id");
      if (!id) {
        try { id = sessionStorage.getItem("participantId"); } catch { /* ignore */ }
      }
      id = (id || "").trim();
      if (!id) {
        window.location.replace("landing.html");
        return;
      }
      document.getElementById("captureLink").href = "capture.html?id=" + encodeURIComponent(id);
      // Testing shortcut: same capture flow, but the exam opens at the reading tasks.
      document.getElementById("readingLink").href =
        "capture.html?id=" + encodeURIComponent(id) + "&start=reading-directions";
    })();
  </script>
</body>
</html>
